<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Commander Companion • Monster Siege</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07050b;color:#fff;font:14px system-ui}#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at center,#261b35,#09070e)}#appView{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;filter:brightness(.73) saturate(.85)}#shade{position:absolute;inset:0;background:linear-gradient(0deg,#08060bd9,transparent 28%,transparent 78%,#09051175);pointer-events:none}#ground{position:absolute;bottom:0;width:100%;height:7%;background:linear-gradient(#4d3955,#0b0910 12%);border-top:2px solid #b48ed0;box-shadow:0 -3px 28px #ad6af333}#overlay{position:absolute;inset:0;pointer-events:none}#actors,#debris,#pieces,#effects{position:absolute;inset:0;pointer-events:none}#actors{z-index:7}#pieces{z-index:5}#debris{z-index:8}#effects{z-index:9}.actor{position:absolute;width:clamp(100px,17vw,210px);height:clamp(130px,39vh,320px);bottom:6%;left:-25%;transform-origin:50% 100%;will-change:left,bottom,transform;filter:drop-shadow(0 12px 9px #000b)}.actor svg{width:100%;height:100%;overflow:visible}.actor.walk svg{animation:bob .3s infinite alternate ease-in-out}.actor.claw svg{animation:claw .22s infinite alternate}.actor.bite svg{animation:bite .18s infinite alternate}.actor.pull svg{animation:pull .33s infinite alternate}.actor.fight svg{animation:fight .17s infinite alternate}.actor.defeated{transform:rotate(85deg) scaleY(.8)!important;transition:transform .55s ease-in}.actor .tail{transform-origin:35% 65%;animation:tail 1.2s infinite alternate}.actor .arm{transform-origin:65% 45%}.actor.claw .arm,.actor.pull .arm{animation:arm .25s infinite alternate}.actor .eye{filter:drop-shadow(0 0 4px #ffef74)}@keyframes bob{to{transform:translateY(-7px) rotate(2deg)}}@keyframes tail{to{transform:rotate(9deg)}}@keyframes arm{to{transform:rotate(-28deg)}}@keyframes claw{to{transform:rotate(-5deg) translateY(-8px)}}@keyframes bite{to{transform:rotate(6deg) translateX(7px)}}@keyframes pull{to{transform:rotate(-8deg) translateX(-6px)}}@keyframes fight{to{transform:rotate(6deg) translateX(10px)}}.piece{position:absolute;background:linear-gradient(135deg,#4b345b,#1b1528);border:2px solid #bca4da;box-shadow:inset 0 0 12px #d6a5ff44,0 0 16px #100c1c;border-radius:6px;color:#eee;font-weight:800;text-align:center;display:grid;place-items:center;will-change:transform,top,left;overflow:hidden}.piece::before{content:'';position:absolute;inset:4px;border:1px solid #ffffff22}.piece span{font-size:clamp(9px,1.3vw,17px);text-shadow:0 2px 3px #000}.shard{position:absolute;background:linear-gradient(45deg,#a77cc0,#31223d);border:1px solid #dbc3ef;clip-path:polygon(0 0,100% 20%,55% 100%,5% 80%);width:14px;height:15px}.spark{position:absolute;width:5px;height:5px;background:#f5c4ff;box-shadow:0 0 8px #fff;border-radius:50%}#hud{position:absolute;z-index:20;left:12px;top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:96%}button{background:linear-gradient(#65437f,#281b39);border:1px solid #c4a3e5;color:#fff;border-radius:7px;padding:9px 13px;font-weight:800;cursor:pointer;touch-action:manipulation}#readout{padding:8px;background:#120c1bc9;border-radius:5px;font-size:12px}#bubble{position:absolute;z-index:15;bottom:46%;left:50%;transform:translateX(-50%);max-width:min(78%,520px);padding:17px 23px;border-radius:22px;background:#f8f0dd;color:#231627;border:4px solid #312039;font-weight:900;font-size:clamp(13px,2.3vw,22px);text-align:center;box-shadow:0 12px 30px #000a;display:none}#bubble:after{content:'';position:absolute;bottom:-21px;left:60%;border-width:20px 13px 0;border-style:solid;border-color:#312039 transparent transparent}#label{position:absolute;right:10px;bottom:8px;z-index:20;color:#d7c6e4;font-size:11px;text-shadow:0 1px 2px black}@media(orientation:portrait){#hud{top:5px}#readout{display:none}.actor{height:24%;width:25%}#bubble{bottom:32%}}
</style></head><body><div id="stage"><iframe id="appView" src="../rebuild/" title="Commander Companion live screen background" tabindex="-1"></iframe><div id="shade"></div><div id="ground"></div><div id="pieces"></div><div id="actors"></div><div id="debris"></div><div id="effects"></div><div id="bubble"></div><div id="hud"><button id="new">New random siege</button><button id="pause">Pause</button><span id="readout">Preparing the monsters…</span></div><div id="label">ISOLATED ANIMATION TEST · ORIGINAL APP NOT MODIFIED</div></div><script>
(()=>{'use strict';
const stage=document.querySelector('#stage'),actors=document.querySelector('#actors'),pieces=document.querySelector('#pieces'),debris=document.querySelector('#debris'),effects=document.querySelector('#effects'),bubble=document.querySelector('#bubble'),readout=document.querySelector('#readout'),pauseBtn=document.querySelector('#pause');
const monsters=[{name:'Bogscale Ravager',type:'reptile',body:'#577f4c',dark:'#263d2c',light:'#a4c27c',horn:'#d4c5a0'},{name:'Crimson Jaw',type:'reptile',body:'#a34b37',dark:'#512521',light:'#e49b6c',horn:'#e9d7b3'},{name:'Ironback Crocodilian',type:'reptile',body:'#557c79',dark:'#253d43',light:'#a5c8b2',horn:'#c6bfa2'},{name:'Tusked Orc',type:'orc',body:'#71894a',dark:'#303b2b',light:'#aabf72',horn:'#f2d9aa'},{name:'Granite Troll',type:'troll',body:'#777c88',dark:'#393b49',light:'#b2aeb7',horn:'#d5d0c9'},{name:'Emberhorn Ogre',type:'orc',body:'#87654b',dark:'#423025',light:'#c39b75',horn:'#ead8b1'}];
const heroes=[{name:'Elven Sentinel',body:'#6da6a0',dark:'#244d53',light:'#b5e2c7',weapon:'sword'},{name:'Dwarven Ranger',body:'#ad6e42',dark:'#57342a',light:'#e4ba77',weapon:'axe'},{name:'Arcane Battlemage',body:'#7858ae',dark:'#352850',light:'#c9b3f0',weapon:'staff'}];
const jokes=['You left your device unattended. The lizard nearly built a deck.','Next time, lock your screen. I charge extra for dragon removal.','I saved your cards. Your warranty, however, is another story.','That monster had terrible table manners. And worse deck synergy.','Never leave your battlefield unattended. It attracts very rude guests.','I defeated the ogre. You owe me one legendary artifact.','Your screen is safe. Your life total? I make no promises.','A little security would have saved us a boss fight.'];
const pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>a+Math.random()*(b-a),wait=ms=>new Promise(r=>setTimeout(r,ms));let session=0,paused=false;
const S=()=>({w:stage.clientWidth,h:stage.clientHeight,floor:stage.clientHeight*.93});
function monsterSVG(m){let rept=m.type==='reptile';return '<svg viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="skin" x2=".9" y2="1"><stop stop-color="'+m.light+'"/><stop offset=".42" stop-color="'+m.body+'"/><stop offset="1" stop-color="'+m.dark+'"/></linearGradient></defs><ellipse cx="109" cy="268" rx="75" ry="8" fill="#0008"/>'+(rept?'<path class="tail" d="M75 169 Q22 167 7 219 Q33 207 94 206" fill="'+m.dark+'" stroke="'+m.body+'" stroke-width="6"/>':'')+'<path d="M84 182 L67 255 103 260 120 208 136 259 175 257 152 179" fill="'+m.dark+'" stroke="'+m.light+'" stroke-width="5"/><path d="M70 105 Q47 147 69 205 Q112 226 167 200 Q184 144 149 104 Z" fill="url(#skin)" stroke="'+m.dark+'" stroke-width="8"/><path d="M92 133 Q117 145 144 128 L153 185 Q124 202 90 188Z" fill="'+m.light+'" opacity=".48"/><path class="arm" d="M68 119 Q34 129 27 170 L47 186 83 147 M154 122 Q194 123 198 171 L176 190 144 147" fill="none" stroke="'+m.dark+'" stroke-width="22" stroke-linecap="round"/><path d="M24 170 L12 193 31 188 40 199 49 179 M181 181 L178 202 194 192 204 199 201 171" fill="'+m.horn+'"/>'+(rept?'<path d="M61 90 Q62 45 111 46 Q168 46 173 90 L204 111 188 129 115 128 71 116Z" fill="url(#skin)" stroke="'+m.dark+'" stroke-width="8"/><path d="M106 111 Q154 133 197 113 L185 133 Q148 150 106 123" fill="'+m.dark+'"/><path d="M132 122 l8 13 8 -11 8 13 8 -12 8 11 9 -15" fill="'+m.horn+'"/><path d="M78 52 L62 18 101 48 M145 51 L171 20 159 64" fill="'+m.horn+'"/>':'<path d="M68 89 Q56 41 112 32 Q166 36 164 92 L156 124 Q113 148 75 118Z" fill="url(#skin)" stroke="'+m.dark+'" stroke-width="8"/><path d="M69 57 L48 18 96 43 M150 49 L178 16 166 73" fill="'+m.horn+'"/><path d="M85 110 L80 133 103 117 M145 112 L156 134 131 116" fill="'+m.horn+'"/>')+'<ellipse class="eye" cx="100" cy="84" rx="7" ry="5" fill="#f7e76a"/><ellipse class="eye" cx="151" cy="85" rx="7" ry="5" fill="#f7e76a"/><path d="M97 84 l4 0 M149 85 l4 0" stroke="#1d1c14" stroke-width="3"/><path d="M83 232 L62 259 103 263 M146 237 L134 263 178 263" fill="'+m.dark+'" stroke="'+m.horn+'" stroke-width="4"/></svg>'}
function heroSVG(h){return '<svg viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg"><ellipse cx="111" cy="269" rx="66" ry="7" fill="#0008"/><path d="M90 175 L79 258 111 260 119 204 132 258 166 258 151 175" fill="'+h.dark+'" stroke="'+h.light+'" stroke-width="4"/><path d="M67 95 Q42 147 61 206 L106 189 169 207 Q179 132 146 95Z" fill="'+h.dark+'"/><path d="M78 107 Q116 91 154 111 L158 192 Q113 207 75 186Z" fill="'+h.body+'" stroke="'+h.light+'" stroke-width="7"/><path d="M75 120 L40 164 56 183 91 148 M153 118 L177 160 163 181 135 149" fill="none" stroke="'+h.body+'" stroke-width="19" stroke-linecap="round"/><path d="M82 75 Q82 39 116 34 Q152 36 154 79 L140 106 94 104Z" fill="#d6ae88"/><path d="M71 63 Q70 16 118 21 Q160 17 166 64 L150 57 139 42 90 57Z" fill="'+h.dark+'" stroke="'+h.light+'" stroke-width="5"/><path d="M93 77 h9 M132 77 h9" stroke="#2b2526" stroke-width="4"/><path d="M95 105 L113 126 137 105" fill="none" stroke="'+h.light+'" stroke-width="6"/><path d="M76 172 L154 172" stroke="#e7ca80" stroke-width="10"/>'+(h.weapon==='sword'?'<path d="M180 160 L198 27 207 19 204 37 193 164" fill="#d5e4f5" stroke="#8a9cab" stroke-width="3"/><path d="M165 155 L211 166" stroke="#e9ca7b" stroke-width="8"/>':h.weapon==='axe'?'<path d="M182 172 L200 40" stroke="#b89b6e" stroke-width="10"/><path d="M193 45 Q148 27 162 85 L193 76 217 91 213 38Z" fill="#b6c6d1" stroke="#5e6978" stroke-width="5"/>':'<path d="M185 184 L196 42" stroke="#b29ac6" stroke-width="10"/><circle cx="197" cy="37" r="18" fill="#c78fff" stroke="#f5d5ff" stroke-width="5"/>')+'</svg>'}
function makeActor(data,hero=false){let el=document.createElement('div');el.className='actor';el.innerHTML=hero?heroSVG(data):monsterSVG(data);actors.append(el);return el}
function move(el,x,y=0,scale=1,flip=false){el.style.left=x+'px';el.style.bottom=(S().h*.07+y)+'px';el.style.transform='scale('+(flip?-scale:scale)+','+scale+')'}
function createPieces(){pieces.replaceChildren();let {w,h}=S();let defs=[['COMMANDER',.07,.16,.19,.12],['LIFE 40',.04,.65,.16,.12],['BATTLEFIELD',.34,.32,.29,.16],['DRAW',.74,.72,.17,.12],['GRAVEYARD',.75,.36,.19,.14],['MANA',.36,.73,.19,.11],['SETTINGS',.77,.09,.17,.10],['HAND',.29,.86,.32,.09]];return defs.map(([label,x,y,bw,bh])=>{let el=document.createElement('div');el.className='piece';el.style.cssText='left:'+(x*w)+'px;top:'+(y*h)+'px;width:'+(bw*w)+'px;height:'+(bh*h)+'px';el.innerHTML='<span>'+label+'</span>';pieces.append(el);return {el,label,x:x*w,y:y*h,w:bw*w,h:bh*h,broken:false}})}
async function sleep(ms,id){let t=0;while(t<ms&&id===session){if(!paused){let step=Math.min(40,ms-t);await wait(step);t+=step}else await wait(60)}return id===session}
async function tween(el,x1,y1,x2,y2,ms,id,scale=1,flip=false){let t=0;while(t<ms&&id===session){if(!paused){t+=16;let u=Math.min(1,t/ms),ease=u*u*(3-2*u);move(el,x1+(x2-x1)*ease,y1+(y2-y1)*ease,scale,flip)}await wait(16)}return id===session}
function blast(x,y,count=19){for(let i=0;i<count;i++){let s=document.createElement('div');s.className=i%3?'shard':'spark';s.style.left=x+'px';s.style.top=y+'px';debris.append(s);let vx=rand(-210,210),vy=rand(-290,-80),rot=rand(-350,350),floor=S().floor-y;s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+vx*.9+'px,'+Math.max(floor,vy*.9+300)+'px) rotate('+rot+'deg)',opacity:0}],{duration:rand(650,1300),easing:'cubic-bezier(.24,.56,.58,1)',fill:'forwards'}).onfinish=()=>s.remove()}}
async function rip(item,monster,id,mode){let e=item.el,rect=e.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;monster.className='actor '+mode;readout.textContent='Monster '+mode+'ing '+item.label;await sleep(450,id);if(id!==session)return;e.style.zIndex=8;let dx=rand(-S().w*.45,S().w*.48),fall=S().floor-cy;let a=e.animate([{transform:'translate(0,0) rotate(0deg) scale(1)'},{transform:'translate('+(dx*.35)+'px,-'+rand(45,115)+'px) rotate(-25deg) scale(1.03)',offset:.28},{transform:'translate('+dx+'px,'+fall+'px) rotate('+rand(-300,300)+'deg) scale(.8)',offset:.78},{transform:'translate('+dx+'px,'+(fall-24)+'px) rotate(12deg) scale(.62)',offset:.88},{transform:'translate('+dx+'px,'+fall+'px) rotate(25deg) scale(.5)',opacity:0}],{duration:1350,fill:'forwards',easing:'ease-in'});await sleep(990,id);blast(cx+dx,Math.min(S().floor,cy+fall),28);await sleep(370,id);e.remove();item.broken=true}
async function encounter(){let id=++session;paused=false;pauseBtn.textContent='Pause';bubble.style.display='none';actors.replaceChildren();debris.replaceChildren();let items=createPieces(),m=pick(monsters),h=pick(heroes),monster=makeActor(m),hero=makeActor(h,true),size=S(),mw=monster.getBoundingClientRect().width;let scale=Math.min(1.25,Math.max(.75,size.w/900));readout.textContent=m.name+' enters the battlefield';let mx=-mw;move(monster,mx,0,scale);let target=size.w*rand(.48,.75);monster.className='actor walk';if(!await tween(monster,mx,0,target,0,1300,id,scale))return;mx=target;let count=Math.floor(rand(1,Math.min(7,items.length+1)));let candidates=items.sort(()=>Math.random()-.5).slice(0,count);for(let i=0;i<candidates.length;i++){if(id!==session)return;let item=candidates[i],cx=item.x+item.w/2,top=item.y;monster.className='actor walk';if(!await tween(monster,mx,0,cx-mw*.45,0,650,id,scale))return;mx=cx-mw*.45;if(top<size.h*.42){monster.className='actor claw';readout.textContent=m.name+' climbs the frame';if(!await tween(monster,mx,0,mx,Math.min(size.h*.48,size.floor-top-mw*.7),850,id,scale))return;monster.className='actor pull';if(!await sleep(400,id))return}let action=pick(['claw','pull','bite']);await rip(item,monster,id,action);if(id!==session)return;move(monster,mx,0,scale);if(Math.random()<.22&&i>0)break}
readout.textContent=h.name+' arrives to stop '+m.name;let hx=-mw;move(hero,hx,0,scale);hero.className='actor walk';if(!await tween(hero,hx,0,mx-mw*.7,0,950,id,scale))return;hero.className='actor fight';monster.className='actor fight';for(let i=0;i<4;i++){if(!await sleep(230,id))return;blast(mx+mw*.35,size.floor-mw*.8,8)}monster.className='actor defeated';hero.className='actor';readout.textContent=h.name+' wins • '+candidates.filter(x=>x.broken).length+' assets destroyed';bubble.textContent=pick(jokes);bubble.style.display='block'}
document.querySelector('#new').onclick=encounter;pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';readout.textContent=paused?'Animation paused':'Animation resumed'};setTimeout(encounter,550);
})();
</script></body></html>
