name: Commander Companion Browser Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Commander Companion browser tests
        run: npx playwright test

      - name: Save Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-companion-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
