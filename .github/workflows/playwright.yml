name: Commander Companion BS Tap-Cost Tests

on:
  push:
    branches: [ bs-tap-cost-prep ]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Run BS tap-cost regression
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-companion-bs-tap-cost-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
