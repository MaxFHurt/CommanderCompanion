name: Commander Companion BZ Guided Audit

on:
  push:
    branches: [ bz-guided-precon-audit-prep ]
  workflow_dispatch:

jobs:
  guided-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Run ten-precon Guided Resolution audit
        run: npx playwright test tests/live-flows.spec.js -g "Batch 3 final precon stress audit"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-companion-bz-guided-audit
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
