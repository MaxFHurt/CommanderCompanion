name: Commander Companion BT Modal/Alt-Cost Tests

on:
  push:
    branches: [ bt-modal-altcost-safety-prep ]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Run BT modal and alternate-cost regression
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-companion-bt-modal-altcost-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
