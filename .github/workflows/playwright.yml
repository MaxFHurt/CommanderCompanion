name: Commander Companion BN Recovery Tests

on:
  push:
    branches: [ bn-recovery ]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run full BN recovery browser tests locally
        env:
          CC_RUN_FULL_LOCAL: 1
        run: npx playwright test

      - name: Save Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-companion-bn-recovery-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
