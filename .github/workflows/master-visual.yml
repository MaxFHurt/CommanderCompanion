name: Commander Companion Master Visual QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  master-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run master-match acceptance locally
        run: npx playwright test tests/master-match-flow.spec.js --project=chromium

      - name: Wait for matching GitHub Pages build
        shell: bash
        run: |
          EXPECTED_TITLE="$(grep -o '<title>[^<]*</title>' index.html | head -1)"
          echo "Waiting for live page title: $EXPECTED_TITLE"
          for attempt in {1..36}; do
            LIVE_HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "https://maxfhurt.github.io/CommanderCompanion/index.html?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if grep -Fq "$EXPECTED_TITLE" <<< "$LIVE_HTML"; then
              echo "Matching Pages build is live."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run master-match acceptance on live Pages
        env:
          CC_BASE_URL: https://maxfhurt.github.io/CommanderCompanion/
        run: npx playwright test tests/master-match-flow.spec.js --project=chromium

      - name: Save master visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-companion-master-visual
          path: |
            test-results/master-match/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
