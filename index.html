<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Commander Companion — Idle Animation Test</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0915;color:#eee;font:16px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#1b142a}button{font:600 16px system-ui;padding:12px 18px;border:1px solid #a68bd7;border-radius:8px;background:#372651;color:white;touch-action:manipulation}button:active{background:#63448d}#status{font-size:13px;color:#c9b5e8}canvas{display:block;width:100%;height:calc(100dvh - 78px);min-height:250px;touch-action:none}</style></head><body><header><button id="start" type="button">Start / New Encounter</button><button id="pause" type="button">Pause</button><span id="status">Ready</span></header><canvas id="scene"></canvas><script>
(function(){
'use strict';
const c=document.getElementById('scene'),ctx=c.getContext('2d'),status=document.getElementById('status');let w=0,h=0,ground=0,last=0,paused=true,enc=null;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ground=h-28}addEventListener('resize',resize);resize();
function actor(x,color,kind){return{x,v:0,face:1,color,kind,phase:0,mode:'walk',climb:0,dead:false}}
function start(){resize();enc={monster:actor(-45,'#7ba65d','monster'),hero:actor(-50,'#b5a0ef','hero'),stage:'enter',clock:0,target:null,destroyed:0,limit:Math.floor(rnd(2,6)),heroWins:Math.random()>.25,items:[],particles:[],message:''};for(let i=0;i<6;i++){const x=(i+.65)*w/7;enc.items.push({x,y:ground-rnd(38,105),width:Math.max(35,w/10),broken:false,shake:0,fall:0})}paused=false;last=0;document.getElementById('pause').textContent='Pause';status.textContent='Encounter running';}
function walk(a,target,speed,dt){let dx=target-a.x;a.face=dx<0?-1:1;const desired=clamp(dx*4,-speed,speed);a.v+=(desired-a.v)*(1-Math.exp(-dt*10));a.x+=a.v*dt;a.phase+=Math.abs(a.v)*dt/23;if(Math.abs(dx)<4){a.x=target;a.v=0;return true}return false}
function sparks(x,y){for(let i=0;i<18;i++)enc.particles.push({x,y,vx:rnd(-150,150),vy:rnd(-220,-40),life:rnd(.35,.9)})}
function update(dt){if(!enc)return;let e=enc;e.clock+=dt;for(const p of e.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt}e.particles=e.particles.filter(p=>p.life>0);for(const i of e.items)if(i.broken)i.fall=Math.min(1,i.fall+dt*1.5);
const m=e.monster,q=e.hero;
if(e.stage==='enter'){m.mode='walk';if(walk(m,w*.65,Math.max(90,w*.25),dt)){e.stage='seek';e.clock=0}}
else if(e.stage==='seek'){if(e.destroyed>=e.limit||e.items.every(i=>i.broken)){e.stage='hero';e.clock=0;return}e.target=e.items.find(i=>!i.broken&&i.x>m.x-30)||e.items.find(i=>!i.broken);m.mode='walk';if(walk(m,e.target.x,Math.max(80,w*.2),dt)){e.stage=e.target.y<ground-70?'climb':'smash';m.mode=e.stage;e.clock=0;m.climb=0}}
else if(e.stage==='climb'){m.climb=Math.min(1,m.climb+dt*1.4);if(m.climb>=1){e.stage='smash';m.mode='smash';e.clock=0}}
else if(e.stage==='smash'){if(e.clock>.6){e.target.broken=true;sparks(e.target.x,e.target.y);e.destroyed++;m.climb=0;e.stage='seek';e.clock=0}}
else if(e.stage==='hero'){q.mode='run';if(walk(q,m.x-80,Math.max(180,w*.4),dt)){e.stage='fight';e.clock=0;q.mode='fight';m.mode='fight'}}
else if(e.stage==='fight'){if(e.clock>.35&&e.clock<.4)sparks((q.x+m.x)/2,ground-55);if(e.clock>1.3){(e.heroWins?m:q).dead=true;e.message=e.heroWins?['That is NOT how you close a menu.','I believe your warranty is void.','Critical hit. Terrible customer service.'][Math.floor(rnd(0,3))]:'Monster wins. Your UI has filed a complaint.';e.stage='done';status.textContent=e.message}}
}
function character(a){const climb=a.mode==='climb'?a.climb*65:0,bob=a.mode==='walk'||a.mode==='run'?Math.abs(Math.sin(a.phase*2))*2:0,step=a.mode==='walk'||a.mode==='run'?Math.sin(a.phase*2)*12:0;ctx.save();ctx.translate(a.x,ground-climb-bob);ctx.scale(a.face,1);if(a.dead){ctx.rotate(-1.2);ctx.translate(0,-10)}ctx.strokeStyle=a.color;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,-35);ctx.lineTo(-13+step,0);ctx.moveTo(12,-35);ctx.lineTo(13-step,0);ctx.stroke();ctx.fillStyle=a.color;ctx.fillRect(-19,-74,38,45);ctx.beginPath();ctx.arc(0,-88,20,0,Math.PI*2);ctx.fill();ctx.strokeStyle=a.color;ctx.beginPath();ctx.moveTo(-18,-64);ctx.lineTo(-28-step*.5,-34);ctx.moveTo(18,-64);ctx.lineTo(30+step*.5,-35);ctx.stroke();if(a.kind==='monster'){ctx.fillStyle='#e9d8b5';ctx.beginPath();ctx.moveTo(-15,-99);ctx.lineTo(-20,-122);ctx.lineTo(-5,-104);ctx.moveTo(15,-99);ctx.lineTo(20,-122);ctx.lineTo(5,-104);ctx.fill()}ctx.fillStyle='#17121f';ctx.fillRect(6,-94,6,6);ctx.restore()}
function render(){ctx.fillStyle='#110d1c';ctx.fillRect(0,0,w,h);ctx.fillStyle='#241a32';ctx.fillRect(0,ground,w,h-ground);ctx.fillStyle='#9a77c5';ctx.fillRect(0,ground,w,2);ctx.textAlign='center';ctx.fillStyle='#d8c7f0';ctx.font='bold 20px system-ui';ctx.fillText('COMMANDER COMPANION',w/2,35);if(!enc){ctx.font='15px system-ui';ctx.fillText('Tap Start / New Encounter',w/2,75);return}for(const i of enc.items){ctx.save();ctx.translate(i.x,i.y+45);ctx.rotate(i.fall*1.3);ctx.globalAlpha=1-i.fall*.85;ctx.fillStyle='#392d4d';ctx.strokeStyle='#9e7dc2';ctx.lineWidth=2;ctx.fillRect(-i.width/2,-45,i.width,45);ctx.strokeRect(-i.width/2,-45,i.width,45);ctx.restore()}character(enc.monster);if(['hero','fight','done'].includes(enc.stage))character(enc.hero);for(const p of enc.particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle='#d9a6ff';ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1;if(enc.message){ctx.fillStyle='#eee';ctx.font='bold 16px system-ui';ctx.fillText(enc.message,w/2,75)}}
function frame(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.033);last=t;if(!paused)update(dt);render();requestAnimationFrame(frame)}
document.getElementById('start').addEventListener('click',start);document.getElementById('pause').addEventListener('click',()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';status.textContent=paused?'Paused':'Running'});render();requestAnimationFrame(frame);
})();
</script></body></html>
