<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover'><link rel='stylesheet' href='styles-v0739.css'><link rel='stylesheet' href='game-threefix.css?v=07926'></head><body style='margin:0;background:#000'><main id='gameScreen' class='screen game-screen' style='display:block!important'>
<section class='player-card active player-slot-1 new-visual-master' style='position:absolute;top:220px;left:20px;right:20px'><div class='player-hero'><div class='commanders'><button class='commander-card'><img src='cc-commander-fallback.png'><span class='tax-badge'>TAX 0</span></button></div><div class='player-info'><header class='player-head'><h2 class='player-name'>TEST</h2></header><button class='mana-box mana-box-button available-only'><div class='mana-row' style='--mana-count:4'><span class='mana-pip mana-over'><img src='mana-white.png'><b>3</b></span><span class='mana-pip mana-even'><img src='mana-blue.png'><b>2</b></span><span class='mana-pip mana-under'><img src='mana-red.png'><b>1</b></span><span class='mana-pip mana-even'><img src='mana-colorless.png'><b>0</b></span></div></button></div></div></section>
<section class='visual-hand-zone floating-live-hand'><h3>YOUR HAND</h3><div class='hand-strip hand-strip-framed'>
<button class='hand-card'><img src='cc-commander-fallback.png'></button><button class='hand-card'><img src='cc-commander-fallback.png'></button><button class='hand-card'><img src='cc-commander-fallback.png'></button><button class='hand-card'><img src='cc-commander-fallback.png'></button><button class='hand-card'><img src='cc-commander-fallback.png'></button><button class='hand-card'><img src='cc-commander-fallback.png'></button><button class='hand-card'><img src='cc-commander-fallback.png'></button></div></section>
<div class='visual-bottom-controls floating-live-controls'><div class='hub-phase-controls'><button data-action='next-phase'><span>NEXT PHASE</span></button><button data-action='end-turn'><span>END TURN</span></button></div><nav class='hand-hub-icons'><button data-hub='card-id'></button><button data-hub='chat'></button><button class='hub-mark smart-action-button smart-action-live' data-action='draw'><span>DRAW</span></button><button data-hub='help'></button><button data-hub='settings'></button><button data-hub='profile'></button></nav></div>
</main>
<script>
window.addEventListener('load',()=>{
 const q=s=>document.querySelector(s), rect=e=>{const r=e.getBoundingClientRect();return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),cx:+(r.x+r.width/2).toFixed(1),cy:+(r.y+r.height/2).toFixed(1)}};
 const hand=q('.floating-live-hand'), strip=q('.floating-live-hand .hand-strip'), cards=[...document.querySelectorAll('.floating-live-hand .hand-card')];
 const selectors=['[data-action="next-phase"]','[data-action="end-turn"]','[data-hub="card-id"]','[data-hub="chat"]','.smart-action-button','[data-hub="help"]','[data-hub="settings"]','[data-hub="profile"]'];
 const hits=selectors.map(sel=>{const e=q(sel),r=rect(e),hit=document.elementFromPoint(r.cx,r.cy);return {sel,r,hit:hit?.getAttribute('data-action')||hit?.getAttribute('data-hub')||hit?.className||hit?.tagName}});
 const mana=[...document.querySelectorAll('.mana-pip')].map(e=>{const i=rect(e.querySelector('img')),b=rect(e.querySelector('b'));return {cls:e.className,imgBottom:i.y+i.h,numTop:b.y,below:b.y>=i.y+i.h-0.5}});
 const report={viewport:{w:innerWidth,h:innerHeight},hand:rect(hand),strip:rect(strip),cards:cards.map(rect),handCentered:Math.abs(rect(hand).cx-innerWidth/2)<1,cardGroupCenter:cards.length?+((rect(cards[0]).x+(rect(cards.at(-1)).x+rect(cards.at(-1)).w))/2).toFixed(1):null,hits,mana};
 const pre=document.createElement('pre');pre.id='REPORT';pre.textContent=JSON.stringify(report,null,2);document.body.appendChild(pre);
});
</script></body></html>
